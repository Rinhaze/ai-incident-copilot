services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://incident:incident@postgres:5432/incidents
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
